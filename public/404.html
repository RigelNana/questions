<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>刷题工具</title>
        <script>
            // SPA redirect for GitHub Pages
            // Converts path to query string so index.html can restore it
            var l = window.location;
            var segments = l.pathname.split("/").filter(Boolean);
            // Keep '/questions' for production, or
            // '/questions/previews/<preview-name>' for branch previews.
            var pathSegmentsToKeep =
                segments[1] === "previews" && segments[2] ? 3 : 1;
            l.replace(
                l.protocol +
                    "//" +
                    l.hostname +
                    (l.port ? ":" + l.port : "") +
                    l.pathname
                        .split("/")
                        .slice(0, 1 + pathSegmentsToKeep)
                        .join("/") +
                    "/?/" +
                    l.pathname
                        .slice(1)
                        .split("/")
                        .slice(pathSegmentsToKeep)
                        .join("/")
                        .replace(/&/g, "~and~") +
                    (l.search
                        ? "&" + l.search.slice(1).replace(/&/g, "~and~")
                        : "") +
                    l.hash,
            );
        </script>
    </head>
    <body></body>
</html>
