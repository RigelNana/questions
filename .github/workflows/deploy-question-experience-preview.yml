name: Deploy question experience preview

on:
  push:
    branches: [cursor/question-experience-acfc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-site

      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          path: preview-site

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            production-site/package-lock.json
            preview-site/package-lock.json

      - name: Build production site
        working-directory: production-site
        env:
          VITE_BASE_PATH: /questions/
        run: npm ci && npm run build

      - name: Build branch preview
        working-directory: preview-site
        env:
          VITE_BASE_PATH: /questions/previews/question-experience/
        run: npm ci && npm run build

      - name: Assemble production and preview
        run: |
          mkdir -p site/previews/question-experience
          cp -R production-site/dist/. site/
          cp -R preview-site/dist/. site/previews/question-experience/
          cp preview-site/dist/404.html site/404.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: https://rigelnana.github.io/questions/previews/question-experience/
    steps:
      - uses: actions/deploy-pages@v4
